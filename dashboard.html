<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHiA — Dashboard Ventas</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:      #F0EAE0;
    --surface: #FFFFFF;
    --surface2:#E8E0D4;
    --border:  #D5CCC0;
    --purple:  #4A2D6F;
    --purple2: #7B5EA7;
    --lavender:#C4A8D4;
    --lavender2:#E6D8F0;
    --text:    #2A1D3E;
    --muted:   #9B8AAA;
    --danger:  #C0392B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--purple);
    padding: 0 40px;
    display: flex;
    align-items: center;
    gap: 24px;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    color: #fff;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }

  .logo em {
    font-style: normal;
    font-size: 0.75rem;
    opacity: 0.55;
    font-weight: 400;
    margin-left: 8px;
    letter-spacing: 0.08em;
  }

  .header-sep {
    width: 1px;
    height: 24px;
    background: rgba(255,255,255,0.2);
  }

  .header-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  #status {
    margin-left: auto;
    font-size: 0.68rem;
    color: rgba(255,255,255,0.45);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #status::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: background 0.3s;
  }

  #status.ok::before  { background: #8ef08e; }
  #status.error::before { background: #f08e8e; }

  /* ── Filters ── */
  .filters {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    display: flex;
    gap: 20px;
    padding: 12px 40px;
    align-items: center;
    flex-wrap: wrap;
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .filter-group label {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
    min-width: 130px;
  }

  select:focus, select:hover { border-color: var(--purple2); }

  .btn {
    padding: 7px 18px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity 0.2s;
    letter-spacing: 0.04em;
  }

  .btn:hover { opacity: 0.82; }
  .btn-primary   { background: var(--purple);  color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  /* ── Main ── */
  main {
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── KPI row ── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .kpi {
    background: var(--purple);
    border-radius: 12px;
    padding: 24px 28px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }

  .kpi::after {
    content: '';
    position: absolute;
    bottom: -24px; right: -24px;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }

  .kpi.light {
    background: var(--lavender2);
    color: var(--text);
  }

  .kpi-label {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.7;
    margin-bottom: 14px;
  }

  .kpi.light .kpi-label { color: var(--purple2); opacity: 1; }

  .kpi-value {
    font-family: 'Syne', sans-serif;
    font-size: 2.5rem;
    font-weight: 800;
    line-height: 1;
  }

  .kpi.light .kpi-value { color: var(--purple); }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border-radius: 12px;
    padding: 24px;
    border: 1px solid var(--border);
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--purple);
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ── Grids ── */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
  }

  canvas { max-height: 280px; }

  /* ── Zona breakdown ── */
  .zona-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: start;
  }

  .zona-total {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .zona-total-val {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 20px;
  }

  .zona-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 0;
  }

  .zona-item {
    background: var(--bg);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .zona-item-label {
    font-size: 0.62rem;
    font-weight: 600;
    color: var(--purple2);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }

  .zona-item-value {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
  }

  /* ── Ranking table ── */
  .rank-item {
    display: grid;
    grid-template-columns: 22px 1fr 72px;
    gap: 10px;
    align-items: start;
    margin-bottom: 12px;
  }

  .rank-num {
    font-size: 0.62rem;
    color: var(--muted);
    padding-top: 2px;
  }

  .rank-name {
    font-size: 0.78rem;
    font-weight: 500;
    margin-bottom: 5px;
  }

  .rank-bar-bg {
    height: 4px;
    background: var(--lavender2);
    border-radius: 2px;
  }

  .rank-bar-fill {
    height: 4px;
    background: var(--purple);
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  .rank-val {
    text-align: right;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--purple2);
    padding-top: 2px;
  }

  /* ── Loading ── */
  #loading {
    position: fixed;
    inset: 0;
    background: var(--purple);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    gap: 20px;
    transition: opacity 0.5s;
  }

  #loading.hidden { opacity: 0; pointer-events: none; }

  .load-logo {
    font-family: 'Syne', sans-serif;
    font-size: 2.4rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.08em;
  }

  .load-sub {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .spinner {
    width: 38px; height: 38px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: rgba(255,255,255,0.8);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error ── */
  #error-msg {
    display: none;
    background: #fff5f5;
    border: 1px solid #f5c0c0;
    border-radius: 10px;
    padding: 20px 28px;
    color: var(--danger);
    font-size: 0.8rem;
    line-height: 1.7;
    margin: 0 40px;
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .kpi-row, .grid-2, .grid-3, .zona-section { grid-template-columns: 1fr; }
    header, .filters, main { padding-left: 20px; padding-right: 20px; }
    .zona-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="load-logo">CHiA</div>
  <div class="spinner"></div>
  <div class="load-sub">Cargando datos...</div>
</div>

<div id="error-msg"></div>

<header>
  <div class="logo">CHiA <em>good food</em></div>
  <div class="header-sep"></div>
  <div class="header-title">Dashboard Ventas</div>
  <div id="status">Conectando</div>
</header>

<div class="filters">
  <div class="filter-group">
    <label>Mes/Año</label>
    <select id="f-mes"><option value="">Todos</option></select>
  </div>
  <div class="filter-group">
    <label>Sucursal</label>
    <select id="f-sucursal"><option value="">Todas</option></select>
  </div>
  <div class="filter-group">
    <label>Turno</label>
    <select id="f-turno"><option value="">Todos</option></select>
  </div>
  <div class="filter-group">
    <label>Familia</label>
    <select id="f-familia"><option value="">Todas</option></select>
  </div>
  <button class="btn btn-primary" onclick="applyFilters()">Aplicar</button>
  <button class="btn btn-secondary" onclick="resetFilters()">Limpiar</button>
</div>

<main>

  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi">
      <div class="kpi-label">Total Menus</div>
      <div class="kpi-value" id="kpi-menus">—</div>
    </div>
    <div class="kpi light">
      <div class="kpi-label">Menus por Comanda</div>
      <div class="kpi-value" id="kpi-ratio">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Total Comandas</div>
      <div class="kpi-value" id="kpi-comandas">—</div>
    </div>
  </div>

  <!-- Ranking Familias (full width) -->
  <div class="card">
    <div class="card-title">Ranking Familias</div>
    <canvas id="chart-familia" style="max-height:340px"></canvas>
  </div>

  <!-- Menus por Sucursal + Documentos por Sucursal -->
  <div class="grid-2">
    <div class="card">
      <div class="card-title">Menus por Sucursal</div>
      <canvas id="chart-menus-suc"></canvas>
    </div>
    <div class="card">
      <div class="card-title">Documentos por Sucursal</div>
      <canvas id="chart-docs-suc"></canvas>
    </div>
  </div>

  <!-- Documentos x Zona -->
  <div class="card">
    <div class="card-title">Documentos × Zona</div>
    <div class="zona-section">
      <!-- Left: numbers -->
      <div>
        <div class="zona-total">Total comandas</div>
        <div class="zona-total-val" id="zona-total">—</div>
        <div class="zona-grid" id="zona-grid"></div>
      </div>
      <!-- Right: pie chart -->
      <div>
        <canvas id="chart-zona" style="max-height:300px"></canvas>
      </div>
    </div>
  </div>

  <!-- Evolución mensual + Ranking productos -->
  <div class="grid-2">
    <div class="card">
      <div class="card-title">Evolución de Menus por Mes</div>
      <canvas id="chart-mes"></canvas>
    </div>
    <div class="card">
      <div class="card-title">Ranking de Productos</div>
      <div id="ranking-table"></div>
    </div>
  </div>

</main>

<script>
const $ = id => document.getElementById(id);
const fmt  = n => Number(n).toLocaleString('es-AR');
const fmt2 = n => Number(n).toFixed(2).replace('.', ',');

const PURPLE_PALETTE = [
  '#4A2D6F','#7B5EA7','#C4A8D4','#9B7EC8',
  '#6B4F8A','#B89AC8','#2D1A45','#D4C0E0',
  '#8A6AB0','#E0D0EE'
];

Chart.defaults.color = '#9B8AAA';
Chart.defaults.borderColor = '#E8E0D4';
Chart.defaults.font.family = "'Inter', sans-serif";
Chart.defaults.font.size = 11;

const charts = {};
function makeChart(id, config) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart($(id), config);
}

// ── Parse ────────────────────────────────────────────────────────────────────
function parseRows(rows) {
  if (!rows || rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (row[i] || '').trim());
    return obj;
  });
}

function normalizeDatos(rows) {
  return parseRows(rows).map(r => ({
    mes:      r['mes/año'] || r['mes'] || '',
    fecha:    r['fecha']   || '',
    producto: r['producto'] || '',
    sucursal: r['sucursal'] || '',
    turno:    r['turno']   || '',
    cantidad: parseInt(r['cantidad']) || 0,
    familia:  r['familia'] || '',
  })).filter(r => r.fecha && r.cantidad > 0);
}

function normalizeDatos2(rows) {
  return parseRows(rows).map(r => ({
    mes:        r['mes/año'] || r['mes'] || '',
    fecha:      r['fecha']   || '',
    sucursal:   r['sucursal'] || '',
    zona:       r['zona']    || '',
    documentos: parseInt(r['documentos']) || 0,
  })).filter(r => r.fecha && r.documentos > 0);
}

// ── Estado ───────────────────────────────────────────────────────────────────
let rawDatos = [], rawDatos2 = [];
let filteredDatos = [], filteredDatos2 = [];

// ── Filtros ──────────────────────────────────────────────────────────────────
function populateFilters() {
  const meses     = [...new Set(rawDatos.map(r => r.mes))].filter(Boolean).sort();
  const sucursales= [...new Set(rawDatos.map(r => r.sucursal))].filter(Boolean).sort();
  const turnos    = [...new Set(rawDatos.map(r => r.turno))].filter(Boolean).sort();
  const familias  = [...new Set(rawDatos.map(r => r.familia))].filter(Boolean).sort();
  populate('f-mes', meses);
  populate('f-sucursal', sucursales);
  populate('f-turno', turnos);
  populate('f-familia', familias);
}

function populate(id, values) {
  const sel = $(id);
  const first = sel.options[0];
  sel.innerHTML = '';
  sel.appendChild(first);
  values.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
}

function applyFilters() {
  const mes    = $('f-mes').value;
  const suc    = $('f-sucursal').value;
  const turno  = $('f-turno').value;
  const familia= $('f-familia').value;
  filteredDatos  = rawDatos.filter(r =>
    (!mes    || r.mes      === mes)    &&
    (!suc    || r.sucursal === suc)    &&
    (!turno  || r.turno    === turno)  &&
    (!familia|| r.familia  === familia)
  );
  filteredDatos2 = rawDatos2.filter(r =>
    (!mes || r.mes === mes) && (!suc || r.sucursal === suc)
  );
  render();
}

function resetFilters() {
  ['f-mes','f-sucursal','f-turno','f-familia'].forEach(id => $(id).value = '');
  filteredDatos  = [...rawDatos];
  filteredDatos2 = [...rawDatos2];
  render();
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function groupBy(arr, key, valKey) {
  const map = {};
  arr.forEach(r => {
    const k = r[key] || 'Sin dato';
    map[k] = (map[k] || 0) + (valKey ? r[valKey] : 1);
  });
  return map;
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  renderKPIs();
  renderRankingFamilias();
  renderMenusSucursal();
  renderDocsSucursal();
  renderZona();
  renderMes();
  renderRankingProductos();
}

function renderKPIs() {
  const totalMenus    = filteredDatos.reduce((s, r) => s + r.cantidad, 0);
  const totalComandas = filteredDatos2.reduce((s, r) => s + r.documentos, 0);
  const ratio = totalComandas > 0 ? (totalMenus / totalComandas) : 0;
  $('kpi-menus').textContent    = fmt(totalMenus);
  $('kpi-comandas').textContent = fmt(totalComandas);
  $('kpi-ratio').textContent    = fmt2(ratio);
}

function renderRankingFamilias() {
  const grouped = groupBy(filteredDatos, 'familia', 'cantidad');
  const labels  = Object.keys(grouped).sort((a, b) => grouped[b] - grouped[a]);
  makeChart('chart-familia', {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Cantidad',
        data: labels.map(l => grouped[l]),
        backgroundColor: '#4A2D6F',
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#E8E0D4' }, beginAtZero: true },
        y: { grid: { display: false } }
      }
    }
  });
}

function renderMenusSucursal() {
  const grouped = groupBy(filteredDatos, 'sucursal', 'cantidad');
  const labels  = Object.keys(grouped).sort((a, b) => grouped[b] - grouped[a]);
  makeChart('chart-menus-suc', {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Menus',
        data: labels.map(l => grouped[l]),
        backgroundColor: '#7B5EA7',
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: '#E8E0D4' }, beginAtZero: true }
      }
    }
  });
}

function renderDocsSucursal() {
  const grouped = groupBy(filteredDatos2, 'sucursal', 'documentos');
  const labels  = Object.keys(grouped).sort((a, b) => grouped[b] - grouped[a]);
  makeChart('chart-docs-suc', {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Documentos',
        data: labels.map(l => grouped[l]),
        backgroundColor: '#9B7EC8',
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: '#E8E0D4' }, beginAtZero: true }
      }
    }
  });
}

function renderZona() {
  const grouped = groupBy(filteredDatos2, 'zona', 'documentos');
  const total   = Object.values(grouped).reduce((s, v) => s + v, 0);
  const labels  = Object.keys(grouped).sort((a, b) => grouped[b] - grouped[a]);

  $('zona-total').textContent = fmt(total);

  // Números individuales por zona
  $('zona-grid').innerHTML = labels.map(z => `
    <div class="zona-item">
      <div class="zona-item-label">${z}</div>
      <div class="zona-item-value">${fmt(grouped[z])}</div>
    </div>
  `).join('');

  // Pie chart
  makeChart('chart-zona', {
    type: 'pie',
    data: {
      labels,
      datasets: [{
        data: labels.map(l => grouped[l]),
        backgroundColor: PURPLE_PALETTE.slice(0, labels.length),
        borderWidth: 2,
        borderColor: '#fff',
      }]
    },
    options: {
      plugins: {
        legend: { position: 'right', labels: { padding: 14, boxWidth: 12, usePointStyle: true } }
      }
    }
  });
}

function renderMes() {
  const grouped = groupBy(filteredDatos, 'mes', 'cantidad');
  const labels  = Object.keys(grouped).sort();
  makeChart('chart-mes', {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: labels.map(l => grouped[l]),
        backgroundColor: labels.map((_, i) =>
          `rgba(74,45,111,${0.4 + (i / Math.max(labels.length - 1, 1)) * 0.6})`
        ),
        borderRadius: 5,
        borderSkipped: false,
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: '#E8E0D4' }, beginAtZero: true }
      }
    }
  });
}

function renderRankingProductos() {
  const grouped = groupBy(filteredDatos, 'producto', 'cantidad');
  const sorted  = Object.entries(grouped).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const max     = sorted[0]?.[1] || 1;

  $('ranking-table').innerHTML = sorted.map(([prod, qty], i) => `
    <div class="rank-item">
      <span class="rank-num">${String(i + 1).padStart(2, '0')}</span>
      <div>
        <div class="rank-name">${prod}</div>
        <div class="rank-bar-bg">
          <div class="rank-bar-fill" style="width:${Math.round(qty / max * 100)}%"></div>
        </div>
      </div>
      <span class="rank-val">${fmt(qty)}</span>
    </div>
  `).join('');
}

// ── Fetch & boot ─────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch('/data');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);

    rawDatos  = normalizeDatos(json.datos);
    rawDatos2 = normalizeDatos2(json.datos2);

    populateFilters();
    filteredDatos  = [...rawDatos];
    filteredDatos2 = [...rawDatos2];
    render();

    $('status').textContent = `${fmt(rawDatos.length + rawDatos2.length)} filas`;
    $('status').className = 'ok';
    $('loading').classList.add('hidden');

  } catch (err) {
    $('loading').classList.add('hidden');
    $('status').textContent = 'Error';
    $('status').className = 'error';
    $('error-msg').style.display = 'block';
    $('error-msg').innerHTML = `
      <strong>No se pudo conectar al servidor.</strong><br><br>
      Asegurate de que <code>server.py</code> está corriendo:<br>
      <code style="color:#7B5EA7">python server.py</code><br><br>
      Error: ${err.message}
    `;
  }
}

loadData();
</script>
